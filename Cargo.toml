[package]
name = "nacelle-translator"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Węzeł PipeWire tłumaczący w locie dźwięk w drodze do urządzenia wyjściowego (whisper.cpp → Claude API → piper)"

[dependencies]
pipewire = { version = "0.10.1", features = ["v1_2_0"] }
ringbuf = "0.5"
rubato = "5.0"
audioadapter-buffers = "5.2"
voice_activity_detector = "0.2"
whisper-rs = { version = "0.16", features = ["cuda"] }
crossbeam-channel = "0.5"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hound = "3.5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
bytemuck = "1"

[profile.release]
lto = "thin"
